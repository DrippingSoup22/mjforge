name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build, unit tests, headless validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MuJoCo (the C library ships inside the Python package)
        run: python -m pip install mujoco==3.16.0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build build

      - name: Unit and integration tests
        run: ./build/bin/mjforge_tests

      - name: Validate templates and examples
        run: |
          for t in quadruped hexapod biped hopper arm; do ./build/bin/mjforge --template "$t" --validate; done
          for f in examples/*/*.mjforge; do ./build/bin/mjforge "$f" --validate; done

      - name: Export templates for the MuJoCo Warp job
        run: |
          mkdir -p out
          for t in quadruped hexapod biped hopper arm; do
            ./build/bin/mjforge --template "$t" --export "out/$t.xml" --loader
          done

      - uses: actions/upload-artifact@v4
        with:
          name: exported-mjcf
          path: out

  mjwarp:
    name: Exports run in MuJoCo Warp (CPU)
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MuJoCo and MuJoCo Warp
        run: python -m pip install mujoco==3.16.0 mujoco-warp==3.16.0

      - uses: actions/download-artifact@v4
        with:
          name: exported-mjcf
          path: out

      - name: Same rollout in MuJoCo C and MuJoCo Warp, no buffer overflows
        run: |
          for f in out/*.xml examples/*/*.xml; do
            echo "::group::$f"
            python tools/check_mjwarp.py "$f" --steps 200 --nworld 4 --device cpu
            echo "::endgroup::"
          done
